[package]
name = "mysql-s3-backup"
version = "4.0.1"
edition = "2024"
rust-version = "1.94.1"
description = "Stream mysqldump backups to Amazon S3 and S3-compatible storage"
license = "MIT"
repository = "https://github.com/joanfabregat/mysql-s3-backup"
publish = false

[dependencies]
anyhow = "1"
aws-config = { version = "1.12", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-types = "1"
flate2 = "1"
# The HTTP and TLS stack the AWS SDK already pulls in, used for HEARTBEAT_URL.
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "native-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
md-5 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, Clippy and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --bins --locked

  audit:
    name: Cargo audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  # Every integration test against a real server and a real S3-compatible
  # store: a backup restored into a fresh database and compared by checksum,
  # multi-database keys, the engine warning, and the failure paths (mysqldump
  # failing mid-stream, a stall hitting DUMP_TIMEOUT, SIGTERM, an S3 error),
  # each asserting that no object and no multipart upload is left behind.
  integration:
    name: Integration (${{ matrix.db }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:8.4", "mariadb:11.4", "mariadb:11.8"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ["3306:3306"]
      s3:
        image: versity/versitygw:v1.8.0
        env:
          ROOT_ACCESS_KEY: testkey
          ROOT_SECRET_KEY: testsecret123
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp/vgw
        ports: ["7070:7070"]
    env:
      TEST_REQUIRE_INTEGRATION: "1"
      TEST_S3_ENDPOINT: http://127.0.0.1:7070
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: rootpw
      AWS_ACCESS_KEY_ID: testkey
      AWS_SECRET_ACCESS_KEY: testsecret123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the MariaDB client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mariadb-client

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo test --test integration --locked --no-run

      - name: Wait for the database and S3
        run: |
          for _ in $(seq 1 60); do
            if MYSQL_PWD=rootpw mariadb -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1 \
                && curl -s -o /dev/null http://127.0.0.1:7070; then
              exit 0
            fi
            sleep 2
          done
          MYSQL_PWD=rootpw mariadb -h 127.0.0.1 -u root -e 'SELECT 1'
          exit 1

      - name: Integration tests
        run: cargo test --test integration --locked -- --test-threads=4

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  # Builds the real image, scans it, then runs the database integration tests
  # through it, so the shipped binary, its mariadb-client and its user are what
  # get tested.
  image:
    name: Image scan and end-to-end tests
    runs-on: ubuntu-26.04
    services:
      db:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports: ["3306:3306"]
      s3:
        image: versity/versitygw:v1.8.0
        env:
          ROOT_ACCESS_KEY: testkey
          ROOT_SECRET_KEY: testsecret123
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp/vgw
        ports: ["7070:7070"]
    env:
      TEST_REQUIRE_INTEGRATION: "1"
      TEST_IMAGE: mysql-s3-backup:scan
      TEST_S3_ENDPOINT: http://127.0.0.1:7070
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3306"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: rootpw
      AWS_ACCESS_KEY_ID: testkey
      AWS_SECRET_ACCESS_KEY: testsecret123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mysql-s3-backup:scan

      # ignore-unfixed: only fail on CVEs that have an upstream fix available
      # (the actionable set). Without it, an unfixable upstream CVE would block
      # every build until the dependency cuts a release. The binary is built
      # with cargo-auditable, so this covers its Rust crates as well as Alpine.
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mysql-s3-backup:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Install the MariaDB client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mariadb-client

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the test harness
        run: cargo test --test integration --locked --no-run

      - name: Wait for the database and S3
        run: |
          for _ in $(seq 1 60); do
            if MYSQL_PWD=rootpw mariadb -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1 \
                && curl -s -o /dev/null http://127.0.0.1:7070; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: End-to-end tests through the image
        run: cargo test --test integration --locked -- --test-threads=4

  # The release builds arm64 by cross-compiling (see the Dockerfile); this
  # catches a broken cross build before a tag does. QEMU only runs the runtime
  # stage's apk commands.
  image-arm64:
    name: arm64 image build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-26.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config auto --error
